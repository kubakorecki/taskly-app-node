name: test-agent

# The test agent writes unit tests for a PR (PR run) or for one package (Backfill run), and this workflow owns
# every side effect around it (docs/adr/0001). `generate` runs the agent with the Claude token and read-only
# contents; it uploads a patch, the report and the transcript for the publish job.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      scope:
        description: Backfill run scope
        type: choice
        options: [backend, frontend]
        required: true
      model:
        description: Model for the test agent
        type: choice
        options: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]
        default: claude-opus-5-5

permissions: {}

# Events a bot sends get a group of their own: the App's push to a PR must not cancel the run that made it.
concurrency:
  group: >-
    test-agent-${{ github.event.sender.type == 'Bot' && github.run_id ||
    github.event.pull_request.number || format('backfill-{0}', inputs.scope) }}
  cancel-in-progress: true

jobs:
  # Fork PRs get no secrets, and their GITHUB_TOKEN can't comment, so the note goes in the run itself.
  fork-note:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          note='The test agent does not run on pull requests from forks. A maintainer can push the branch to this repository to run it.'
          echo "::notice title=Test agent skipped::$note"
          echo "$note" >> "$GITHUB_STEP_SUMMARY"

  generate:
    # PR runs skip forks, drafts, the skip-test-agent label, and events whose sender is a GitHub Bot account.
    # The test agent's App pushes as one, so its own commits never start another run (docs/adr/0002).
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.labels.*.name, 'skip-test-agent') &&
        github.event.sender.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      target-count: ${{ steps.manifest.outputs.target-count }}
      agent: ${{ steps.agent.outcome }}
      transcript-url: ${{ steps.transcript.outputs.artifact-url }}
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && 'backfill' || 'pr' }}
      SCOPE: ${{ inputs.scope }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Full history for base...head. The agent can read .git, so no credentials are left in it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      # A PR can rewrite the agent, its skills, guard and wrappers, or add Claude settings, hooks, MCP servers
      # and CLAUDE.md files. The agent runs with the base branch's version of all of them.
      - name: Use the base branch's agent files
        if: env.MODE == 'pr'
        run: |
          git diff --no-renames --name-only -z "$BASE_SHA" HEAD -- scripts .mcp.json ':(glob)**/.claude/**' \
            ':(glob)**/CLAUDE.md' ':(glob)**/CLAUDE.local.md' ':(glob)**/AGENTS.md' |
            while IFS= read -r -d '' file; do
              if git cat-file -e "$BASE_SHA:$file" 2>/dev/null; then git checkout -q "$BASE_SHA" -- "$file"; else git rm -q -- "$file"; fi
            done
          if [[ ! -f .claude/agents/unit-test-agent.md || ! -x scripts/test-agent-manifest.sh ]]; then
            echo '::error::The base branch has no test agent yet, so it runs once this workflow is merged'
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Find the packages to measure
        id: packages
        run: |
          if [[ $MODE == pr ]]; then
            packages=$(scripts/test-agent-manifest.sh pr "$BASE_SHA" "$HEAD_SHA" |
              jq -r '[.files[] | select(.change != "deleted") | .kind | select(. == "backend" or . == "frontend")] | unique | join(" ")')
          else
            packages=$SCOPE
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      # The baseline is coverage at head with the existing tests. Failed tests and missed thresholds still write the summary.
      - name: Install and measure the baseline
        env:
          PACKAGES: ${{ steps.packages.outputs.packages }}
        run: |
          for package in $PACKAGES; do
            (cd "$package" && npm ci)
            scripts/agent-vitest.sh "$package" --coverage --coverage.reporter=json-summary --coverage.reportOnFailure --reporter=dot ||
              echo "::warning::The $package baseline run failed. The baseline covers the tests that ran."
          done

      - name: Write the manifest
        id: manifest
        run: |
          if [[ $MODE == pr ]]; then
            scripts/test-agent-manifest.sh pr "$BASE_SHA" "$HEAD_SHA" > test-agent-manifest.json
          else
            scripts/test-agent-manifest.sh backfill "$SCOPE" > test-agent-manifest.json
          fi
          count=$(jq '[.files[] | select((.kind == "backend" or .kind == "frontend") and .change != "deleted")] | length' test-agent-manifest.json)
          echo "target-count=$count" >> "$GITHUB_OUTPUT"
          echo "Source files for the test agent: $count, over the cap: $(jq '.overflow | length' test-agent-manifest.json)" >> "$GITHUB_STEP_SUMMARY"

      # The patch is what the agent changes from here, so restored agent files aren't part of it.
      - name: Snapshot the working tree
        id: snapshot
        run: |
          printf '%s\n' /test-agent-manifest.json /test-agent-report.json node_modules/ coverage/ >> .git/info/exclude
          git add -A
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
          # Outside the repo, where the agent can't read or write.
          echo "OUT=$RUNNER_TEMP/test-agent" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/test-agent"

      - name: Install Claude Code
        if: steps.manifest.outputs.target-count != '0'
        run: npm install -g @anthropic-ai/claude-code@2.1.312

      # Two layers: the agent's guard hook (scripts/agent-guard.sh) and this allowlist, with everything else
      # denied. A run cut short leaves a report with finished: false, which the publish job still uses.
      - name: Run the test agent
        id: agent
        if: steps.manifest.outputs.target-count != '0'
        continue-on-error: true
        timeout-minutes: 30
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ inputs.model }}
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          claude -p 'Run the test agent on test-agent-manifest.json.' \
            --agent unit-test-agent ${MODEL:+--model "$MODEL"} --max-turns 40 \
            --permission-mode dontAsk \
            --allowedTools Read Glob Grep Edit Write 'Bash(scripts/agent-vitest.sh:*)' 'Bash(scripts/agent-prettier.sh:*)' \
            --strict-mcp-config --no-session-persistence \
            --output-format stream-json --verbose --include-hook-events \
            > "$OUT/transcript.jsonl"

      # Agent frontmatter hooks need a trusted workspace. Headless runs skip the trust check, so the guard should
      # fire on every tool call, but a run where it didn't must never be published. The base branch's .claude is
      # restored above, so the guard is the only PreToolUse hook.
      - name: Check the guard ran on every tool call
        id: guard
        if: ${{ !cancelled() && steps.agent.outcome != 'skipped' }}
        run: |
          read -r calls checks < <(jq -rs '[
            ([.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | .id] | unique | length),
            ([.[] | select(.type == "system" and .subtype == "hook_response" and .hook_event == "PreToolUse")] | length)
          ] | @tsv' "$OUT/transcript.jsonl")
          echo "Tool calls: $calls, guard checks: $checks"
          (( checks >= calls )) || { echo "::error::The guard hook ran on $checks of $calls tool calls"; exit 1; }

      # Test code from the PR runs as the same user as Claude Code and could read the token from /proc (an
      # accepted risk), so output that holds it is never uploaded.
      - name: Collect the outputs
        id: collect
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TREE: ${{ steps.snapshot.outputs.tree }}
        run: |
          git add -A
          git diff --cached --binary "$TREE" > "$OUT/test-agent.patch"
          cp test-agent-manifest.json "$OUT/"
          [[ ! -f test-agent-report.json ]] || cp test-agent-report.json "$OUT/"
          if [[ -n $CLAUDE_CODE_OAUTH_TOKEN ]] && grep -rqF -- "$CLAUDE_CODE_OAUTH_TOKEN" "$OUT"; then
            echo '::error::The agent output contains the Claude token, so nothing is uploaded'
            exit 1
          fi
          git diff --cached --stat "$TREE"

      - name: Upload the transcript
        id: transcript
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && steps.agent.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-agent-transcript
          path: ${{ env.OUT }}/transcript.jsonl
          retention-days: 30

      - name: Upload the patch and report
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && steps.guard.outcome != 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-agent-output
          path: |
            ${{ env.OUT }}/test-agent.patch
            ${{ env.OUT }}/test-agent-manifest.json
            ${{ env.OUT }}/test-agent-report.json
          retention-days: 30
